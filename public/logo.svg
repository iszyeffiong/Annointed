<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183059" />
      <stop offset="100%" stop-color="#0e1d38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d67a" />
      <stop offset="100%" stop-color="#cf9427" />
    </linearGradient>
  </defs>
  
  <!-- Crest Shield -->
  <path d="M50 5 C75 5, 91 18, 91 48 C91 76, 64 91, 50 95 C36 91, 9 76, 9 48 C9 18, 25 5, 50 5 Z" fill="url(#crestBg)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

