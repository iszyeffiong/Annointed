  <path d="M24 67 C35 63, 46 65, 50 70 C54 65, 65 63, 76 67 C76 73, 65 70, 50 76 C35 70, 24 73, 24 67 Z" fill="url(#goldGrad)" opacity="0.85" />
  <path d="M50 70 L50 76" stroke="#0e1d38" stroke-width="2" stroke-linecap="round" />

  <!-- Monogram RG in center -->
  <text x="50" y="54" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="1">RG</text>
</svg>
