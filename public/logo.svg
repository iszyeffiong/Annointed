  <circle cx="50" cy="27" r="12" fill="url(#goldGrad)" opacity="0.9" />
  
  <!-- Subtle sun rays -->
  <path d="M50 9 L50 6 M35 15 L32 12 M65 15 L68 12 M29 27 L25 27 M71 27 L75 27" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75" />

